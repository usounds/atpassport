name: Deploy atpassport

on:
  push:
    branches:
      - main
      - preview
    paths:
      - 'packages/frontend/**'

permissions:
  id-token: write
  contents: write

jobs:
  check-changes:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    outputs:
      should_deploy: ${{ steps.filter.outputs.code == 'true' || github.ref_name == 'main' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check for meaningful changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            code:
              - 'packages/frontend/**'
              - '!packages/frontend/package.json'

  deploy:
    needs: check-changes
    if: needs.check-changes.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Next.js build
        uses: actions/cache@v5
        with:
          path: packages/frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ github.ref_name }}-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('packages/frontend/**.[jt]s', 'packages/frontend/**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ github.ref_name }}-${{ hashFiles('**/pnpm-lock.yaml') }}-
            ${{ runner.os }}-nextjs-${{ github.ref_name }}-

      - name: Build packages
        run: pnpm --filter "@atpassport/client" build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: Deploy
        working-directory: packages/frontend
        run: pnpm sst deploy --stage ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}

      - name: Create Git tag for frontend
        if: github.ref == 'refs/heads/main'
        run: |
          VERSION=$(node -p "require('./packages/frontend/package.json').version")
          TAG="frontend@${VERSION}"
          # Check if tag exists on remote
          if git fetch origin "refs/tags/$TAG:refs/tags/$TAG" --dry-run >/dev/null 2>&1 || git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping."
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

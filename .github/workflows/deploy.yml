name: Deploy AtPassport (Production)

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. pnpm を最初にインストール (これで pnpm: command not found を防ぐ)
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10 # 以前のログに合わせて v10 を指定

      # 2. Node.js のセットアップ (corepack-enabled オプションは削除)
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      # 3. 依存関係のインストール
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 4. AWS 認証 (Secrets に AWS_ROLE_ARN が必要)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-1

      # 5. SST デプロイ
      - name: Deploy
        run: pnpm sst deploy --stage production
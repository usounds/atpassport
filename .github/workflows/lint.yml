name: test & lint

on:
  push:
    branches:
      - preview
  pull_request:
    branches:
      - main
      - preview

permissions:
  contents: read

jobs:
  check-changes:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    outputs:
      should_run: ${{ steps.filter.outputs.code == 'true' || github.base_ref == 'main' || github.ref_name == 'main' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check for meaningful changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            code:
              - '**'
              - '!**/package.json'
              - '!pnpm-lock.yaml'

  check:
    needs: check-changes
    if: needs.check-changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build client library
        run: pnpm --filter "@atpassport/client" build

      - name: Lint
        run: pnpm -r lint

      - name: Test
        run: pnpm -r test

      - name: Install Playwright Browsers
        run: pnpm --filter frontend exec playwright install chromium --with-deps

      - name: Run E2E tests
        run: pnpm --filter frontend test:e2e --project=chromium
        env:
          SESSION_SECRET: "dummy_secret_for_testing_purposes_only"
          NODE_ENV: development
          E2E_TEST: "true"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: packages/frontend/playwright-report/
          retention-days: 30
